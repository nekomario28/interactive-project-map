version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-maintenance:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # The immutable inner Action pin is a reviewed release artifact that only
      # moves through the declared release-chain proof, never via dependency bumps.
      - dependency-name: "nekomario28/interactive-project-map"
    groups:
      actions-maintenance:
        patterns:
          - "*"
