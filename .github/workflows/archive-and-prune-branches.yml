name: Archive and prune remaining branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Archive branch tips as tags, then delete branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repo = process.env.REPO;
          const keep = new Set(['main', 'v1', 'perf/threejs-repository-instancing']);
          async function api(path, init = {}) {
            const r = await fetch(`https://api.github.com${path}`, {
              ...init,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json'
              }
            });
            const text = await r.text();
            if (!r.ok) throw new Error(`${init.method || 'GET'} ${path}: ${r.status} ${text}`);
            return text ? JSON.parse(text) : null;
          }
          const refPath = name => `/repos/${repo}/git/refs/heads/${name.split('/').map(encodeURIComponent).join('/')}`;
          const branches = [];
          for (let page = 1; ; page++) {
            const batch = await api(`/repos/${repo}/branches?per_page=100&page=${page}`);
            branches.push(...batch);
            if (batch.length < 100) break;
          }
          const archived = [];
          const deleted = [];
          for (const {name, commit} of branches) {
            if (keep.has(name)) continue;
            const tag = `archive/branch-cleanup-20260831/${name}`;
            await api(`/repos/${repo}/git/refs`, {
              method: 'POST',
              body: JSON.stringify({ref: `refs/tags/${tag}`, sha: commit.sha})
            });
            archived.push({branch: name, tag, sha: commit.sha});
            await api(refPath(name), {method: 'DELETE'});
            deleted.push(name);
            console.log(`ARCHIVED_AND_DELETED ${name} -> ${tag} ${commit.sha}`);
          }
          console.log(`FINAL_CLEANUP_RESULT ${JSON.stringify({kept:[...keep], archivedCount:archived.length, deletedCount:deleted.length, archived})}`);
          NODE
