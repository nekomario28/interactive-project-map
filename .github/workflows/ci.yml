name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-director-storyeval25-analysis:
    if: github.head_ref == 'exp/ai-director-event-manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install metadata client and ffmpeg
        run: |
          python -m pip install --disable-pip-version-check -q huggingface_hub
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Extract canonical 20-case event manifest
        run: python scripts/ai_director_extract_event_manifest.py
      - name: Audit all StoryEval 25 x 3 actual-duration error burden
        run: python scripts/ai_director_storyeval25_duration_burden.py
      - name: Upload event manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-event-manifest-20
          path: .tmp/ai-director-event-manifest
          if-no-files-found: error
          retention-days: 3
      - name: Upload StoryEval25 burden
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-storyeval25-duration-burden
          path: .tmp/ai-director-storyeval25-burden
          if-no-files-found: error
          retention-days: 3
