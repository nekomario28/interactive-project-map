name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-fresh-regenerate:
    if: github.head_ref == 'exp/ai-director-spotlight-outcomes'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install clients and ffmpeg
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q gradio_client huggingface_hub
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Fresh regenerate sid003 on non-ZeroGPU CPU executor
        continue-on-error: true
        run: python scripts/ai_director_cpu_regen_sid003.py --mode fresh
      - name: Remove raw source
        if: always()
        run: rm -rf .tmp/ai-director-cpu-fresh-sid003/raw
      - name: Upload fresh outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-cpu-fresh-sid003
          path: .tmp/ai-director-cpu-fresh-sid003
          if-no-files-found: error
          retention-days: 3

  cpu-backtrack-regenerate:
    if: github.head_ref == 'exp/ai-director-spotlight-outcomes'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install clients and ffmpeg
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q gradio_client huggingface_hub
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Backtrack from clean prefix sid003 on non-ZeroGPU CPU executor
        continue-on-error: true
        run: python scripts/ai_director_cpu_regen_sid003.py --mode backtrack
      - name: Remove raw source
        if: always()
        run: rm -rf .tmp/ai-director-cpu-backtrack-sid003/raw
      - name: Upload backtrack outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-cpu-backtrack-sid003
          path: .tmp/ai-director-cpu-backtrack-sid003
          if-no-files-found: error
          retention-days: 3
