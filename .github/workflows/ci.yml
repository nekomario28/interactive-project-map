name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Smoke test local project-map action default
        uses: ./
        with:
          github_token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          max_repos: "60"
          forks: "true"
          archived: "false"
          output_dir: .tmp/project-map

      - name: Check action outputs
        run: |
          test -s .tmp/project-map/galaxy.svg
          test -s .tmp/project-map/graph.json
          grep -q "Radial Tree classic map" .tmp/project-map/galaxy.svg
          grep -q "Radial Tree · Classic" .tmp/project-map/galaxy.svg

      - name: Verify
        run: npm run verify

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e
          path: |
            .tmp/playwright-visual
            .tmp/playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3

      - name: Render ten-preset comparison
        run: node scripts/render-preset-comparison.mjs .tmp/project-map/graph.json .tmp/preset-comparison

      - name: Upload preset comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preset-comparison
          path: .tmp/preset-comparison
          if-no-files-found: error
          retention-days: 3
