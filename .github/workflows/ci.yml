name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref != 'exp/ai-director-semantic-split'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify
        run: npm run verify

  browser-e2e:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Chromium browser E2E
        run: npm run test:e2e
      - name: iPhone WebKit smoke
        run: npm run test:e2e:webkit

  ai-director-alternate-executor-probe:
    if: github.head_ref == 'exp/ai-director-semantic-split'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Probe alternate public LTX executors
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q gradio_client
          mkdir -p .tmp/ai-director-alternate-probe
          python - <<'PY' | tee .tmp/ai-director-alternate-probe/apis.txt
          from gradio_client import Client
          spaces = [
              'Upsampler/ltx-video',
              'techfreakworm/LTX2.3-Studio',
              'Lightricks/LTX-2-3',
          ]
          for s in spaces:
              print('\n===', s, '===')
              try:
                  c = Client(s, verbose=False)
                  print(c.view_api(print_info=False))
              except Exception as e:
                  print('ERROR', type(e).__name__, str(e))
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-alternate-executor-probe
          path: .tmp/ai-director-alternate-probe
          if-no-files-found: error
          retention-days: 3
