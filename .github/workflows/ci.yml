name: Cleanup finished branches

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: github.repository == 'nekomario28/interactive-project-map' && github.head_ref == 'maintenance/cleanup-after-100'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only reviewed stale branches, close this PR, and self-remove
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          branches=(
            chore/npm-maintenance-current-main
            chore/pin-pages-actions
            feat-view-controls-focus
            fix/pin-reusable-caller-sha
            maintenance/verify-pages-deploy
            onboarding-reusable-workflow
            refactor/view-state-scope
            tmp-unused
            viewer-state-focus-main
          )
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|v1|maintenance/cleanup-after-100) echo "refusing protected branch $branch" >&2; exit 1 ;;
            esac
            echo "delete $branch"
            curl --fail-with-body --silent --show-error -L -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/git/refs/heads/$branch"
          done
          curl --fail-with-body --silent --show-error -L -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/pulls/$PR_NUMBER" \
            -d '{"state":"closed"}' >/dev/null
          curl --fail-with-body --silent --show-error -L -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/git/refs/heads/maintenance/cleanup-after-100"
