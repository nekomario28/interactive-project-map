name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-reusable-callers-once:
    if: github.repository == 'nekomario28/interactive-project-map' && github.head_ref == 'fix/pin-reusable-caller-sha'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Pin generated reusable workflow callers and restore CI
        shell: bash
        env:
          REUSABLE_SHA: 151b9cabd5968cdfb602115fc440795c14f88745
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          sha = os.environ['REUSABLE_SHA']
          replacements = {
              Path('src/install.ts'): [('const REUSABLE_REF = "v1";', f'const REUSABLE_REF = "{sha}";')],
              Path('scripts/public-home.js'): [("const PROJECT_MAP_REUSABLE_REF='v1';", f"const PROJECT_MAP_REUSABLE_REF='{sha}';")],
              Path('scripts/validate-pages.mjs'): [('generate-project-map.yml@v1', f'generate-project-map.yml@{sha}')],
              Path('tests/install.test.mjs'): [('generate-project-map\\.yml@v1', f'generate-project-map\\.yml@{sha}')],
          }
          for path, pairs in replacements.items():
              source = path.read_text()
              for old, new in pairs:
                  if source.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}')
                  source = source.replace(old, new)
              path.write_text(source)
          PY
          ! grep -R --line-number --fixed-strings 'generate-project-map.yml@v1' src scripts tests
          git checkout origin/main -- .github/workflows/ci.yml
          git add -- src/install.ts scripts/public-home.js scripts/validate-pages.mjs tests/install.test.mjs .github/workflows/ci.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: pin reusable workflow callers immutably"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Smoke test local project-map action default
        uses: ./
        with:
          github_token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          max_repos: "60"
          forks: "true"
          archived: "false"
          output_dir: .tmp/project-map

      - name: Check action outputs
        run: |
          test -s .tmp/project-map/galaxy.svg
          test -s .tmp/project-map/graph.json
          grep -q "Radial Tree classic map" .tmp/project-map/galaxy.svg
          grep -q "Radial Tree · Classic" .tmp/project-map/galaxy.svg

      - name: Gate standard taxonomy on reviewed public portfolio
        run: |
          node scripts/evaluate-semantic.mjs \
            --graph .tmp/project-map/graph.json \
            --expected docs/semantic-evaluation-nekomario28.standard-v1.json \
            --min-assigned-accuracy 1 \
            --min-end-to-end-accuracy 1 \
            --min-coverage 1 \
            --max-ambiguity-rate 0 \
            --max-missing-rate 0 \
            --output .tmp/standard-taxonomy-evaluation.json

      - name: Verify
        run: npm run verify

      - name: Render twelve-preset comparison
        run: node scripts/render-preset-comparison.mjs .tmp/project-map/graph.json .tmp/preset-comparison

      - name: Upload preset comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preset-comparison
          path: .tmp/preset-comparison
          if-no-files-found: error
          retention-days: 3

  browser-e2e:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Chromium browser E2E
        run: npm run test:e2e

      - name: iPhone WebKit smoke
        run: npm run test:e2e:webkit

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e
          path: |
            .tmp/playwright-visual
            .tmp/playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3
