name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Export the *source import graph*, not the public owner/category/repository graph.
      - name: Export source imports for gxkit
        run: node scripts/export-gxkit-deps.mjs --python .tmp/gxkit-source-deps.py

      - name: Inspect source dependencies with gxkit
        uses: nekomario28/gxkit@3f89316641dbd13857a2baf272e6be9c8d5d90ab
        with:
          tool: depsgx
          path: .tmp/gxkit-source-deps.py
          args: --json --no-storyboard

      - name: Smoke test local project-map action default
        uses: ./
        with:
          github_token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          max_repos: "60"
          forks: "true"
          archived: "false"
          output_dir: .tmp/project-map

      - name: Check action outputs
        run: |
          test -s .tmp/project-map/galaxy.svg
          test -s .tmp/project-map/graph.json
          grep -q "Radial Tree classic map" .tmp/project-map/galaxy.svg
          grep -q "Radial Tree · Classic" .tmp/project-map/galaxy.svg

      - name: Gate standard taxonomy on reviewed public portfolio
        run: |
          node scripts/evaluate-semantic.mjs \
            --graph .tmp/project-map/graph.json \
            --expected docs/semantic-evaluation-nekomario28.standard-v1.json \
            --min-assigned-accuracy 1 \
            --min-end-to-end-accuracy 1 \
            --min-coverage 1 \
            --max-ambiguity-rate 0 \
            --max-missing-rate 0 \
            --output .tmp/standard-taxonomy-evaluation.json

      - name: Verify
        run: npm run verify

      - name: Render twelve-preset comparison
        run: node scripts/render-preset-comparison.mjs .tmp/project-map/graph.json .tmp/preset-comparison

      - name: Upload preset comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preset-comparison
          path: .tmp/preset-comparison
          if-no-files-found: error
          retention-days: 3

  browser-e2e:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Chromium browser E2E
        run: npm run test:e2e

      - name: iPhone WebKit smoke
        run: npm run test:e2e:webkit

      - name: Upload gxkit visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gxkit-visual
          path: .tmp/gxkit-visual
          if-no-files-found: warn
          retention-days: 3

      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e
          path: |
            .tmp/playwright-visual
            .tmp/playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 3

  visual-gxkit:
    needs: browser-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout visual checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download browser-rendered geometry and frames
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gxkit-visual
          path: .tmp/gxkit-visual

      - name: Encode observed WebGL frames
        run: |
          set -euo pipefail
          command -v ffmpeg
          for index in 00 01 02 03 04; do
            test -s ".tmp/gxkit-visual/frames/galaxy-$index.png"
          done
          ffmpeg -hide_banner -loglevel error -y -framerate 2 \
            -i .tmp/gxkit-visual/frames/galaxy-%02d.png \
            -c:v libvpx -b:v 1M .tmp/gxkit-visual/galaxy3d-motion.webm
          test -s .tmp/gxkit-visual/galaxy3d-motion.webm
          printf 'PATH = "galaxy3d-motion.webm"\nFROZEN_SECONDS = 1.0\nSAMPLE_FPS = 2.0\n' > .tmp/gxkit-visual/galaxy3d-motion.py

      - name: Inspect rendered Galaxy video with gxkit framegx
        uses: nekomario28/gxkit@3f89316641dbd13857a2baf272e6be9c8d5d90ab
        with:
          tool: framegx
          path: .tmp/gxkit-visual/galaxy3d-motion.py
          args: --json --no-storyboard

      - name: Check observed Canvas and DOM label geometry with gxcore
        run: |
          set -euo pipefail
          GX_PYTHON="$(uv tool dir)/framegx/bin/python"
          test -x "$GX_PYTHON"
          "$GX_PYTHON" scripts/inspect-gxkit-visual.py --self-test
          "$GX_PYTHON" scripts/inspect-gxkit-visual.py .tmp/gxkit-visual/layout.json
