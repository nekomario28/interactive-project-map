name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semantic-split-wave2:
    if: github.head_ref == 'exp/ai-director-semantic-split-wave2'
    strategy:
      fail-fast: false
      matrix:
        subshot: [sid005_1, sid005_2, sid018_1, sid018_2, sid018_3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install generation client and ffmpeg
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q gradio_client
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate one bounded semantic subshot
        continue-on-error: true
        env:
          SUBSHOT_KEY: ${{ matrix.subshot }}
        run: python scripts/ai_director_semantic_split_wave2.py
      - name: Upload subshot outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-wave2-${{ matrix.subshot }}
          path: .tmp/ai-director-wave2-${{ matrix.subshot }}
          if-no-files-found: error
          retention-days: 3
