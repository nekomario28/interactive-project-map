name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-director-minimax-inpaint-repair:
    if: github.head_ref == 'exp/ai-director-local-repair-micro'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact experiment head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install repair client and ffmpeg
        run: |
          python -m pip install --disable-pip-version-check -q gradio_client huggingface_hub
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Execute one bounded sid004 MiniMax local repair
        continue-on-error: true
        run: python scripts/ai_director_minimax_inpaint_health.py
      - name: Upload repair outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-minimax-inpaint-sid004
          path: .tmp/ai-director-minimax-inpaint-health
          if-no-files-found: error
          retention-days: 3
