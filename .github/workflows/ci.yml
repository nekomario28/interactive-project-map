name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Smoke test local project-map action
        uses: ./
        with:
          github_token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          style: obsidian
          max_repos: "1"
          forks: "false"
          archived: "false"
          output_dir: .tmp/project-map

      - name: Check action outputs
        run: |
          test -s .tmp/project-map/galaxy.svg
          test -s .tmp/project-map/graph.json
          grep -q "Obsidian-style map" .tmp/project-map/galaxy.svg

      - name: Verify
        run: npm run verify
