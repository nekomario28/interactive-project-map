name: Update Pages Action pin once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  update-pin:
    if: github.repository == 'nekomario28/interactive-project-map' && github.head_ref == 'chore/update-pages-action-pin'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Replace reviewed Pages Action pin
        run: node scripts/update-pages-action-pin-once.mjs

      - name: Commit exact pin update
        shell: bash
        run: |
          set -euo pipefail
          git add -- scripts/postprocess-public-pages.mjs tests/interaction-polish.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Pages Action pin"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
