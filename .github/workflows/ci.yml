name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-director-endpoint-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Inspect Gradio endpoints
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q gradio_client
          mkdir -p .tmp/ai-director-endpoints
          python - <<'PY' | tee .tmp/ai-director-endpoints/endpoints.txt
          from gradio_client import Client
          spaces = ['Upsampler/ltx-video','techfreakworm/LTX2.3-Studio','Lightricks/LTX-2-3']
          for s in spaces:
              print('\n===',s,'===')
              try:
                  c=Client(s,verbose=False)
                  print('config_version', c.config.get('version'))
                  deps=c.config.get('dependencies',[])
                  for i,d in enumerate(deps):
                      if d.get('backend_fn'):
                          print('DEP',i,'api_name=',d.get('api_name'),'inputs=',d.get('inputs'),'outputs=',d.get('outputs'),'queue=',d.get('queue'))
                  print('ENDPOINT_OBJECTS')
                  for k,e in c.endpoints.items():
                      print(k, getattr(e,'api_name',None), getattr(e,'fn_index',None))
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e))
          PY
      - name: Upload schemas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-endpoint-schemas
          path: .tmp/ai-director-endpoints
          if-no-files-found: error
          retention-days: 3
