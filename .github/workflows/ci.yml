name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-director-semantic-split-alt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experiment PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install generation client and ffmpeg
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q gradio_client
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Execute sid004 1s x 3 semantic split on alternate LTX queue
        continue-on-error: true
        run: python scripts/ai_director_semantic_split_sid004_v2.py
      - name: Upload semantic split evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-semantic-split-sid004-alt
          path: .tmp/ai-director-semantic-split-sid004-v2
          if-no-files-found: warn
          retention-days: 3
