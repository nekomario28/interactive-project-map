name: One-shot branch cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.repository == 'nekomario28/interactive-project-map' && github.head_ref == 'maintenance/branch-cleanup-once'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Delete verified stale branches and self-remove
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/cleanup-stale-branches-once.mjs
