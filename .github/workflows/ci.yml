name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref != 'exp/ai-director-multisource-split'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Smoke test local project-map action default
        uses: ./
        with:
          github_token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          max_repos: "60"
          forks: "true"
          archived: "false"
          output_dir: .tmp/project-map
      - name: Check action outputs
        run: |
          test -s .tmp/project-map/galaxy.svg
          test -s .tmp/project-map/graph.json
          grep -q "Radial Tree classic map" .tmp/project-map/galaxy.svg
          grep -q "Radial Tree · Classic" .tmp/project-map/galaxy.svg
      - name: Gate standard taxonomy on reviewed public portfolio
        run: |
          node scripts/evaluate-semantic.mjs --graph .tmp/project-map/graph.json --expected docs/semantic-evaluation-nekomario28.standard-v1.json --min-assigned-accuracy 1 --min-end-to-end-accuracy 1 --min-coverage 1 --max-ambiguity-rate 0 --max-missing-rate 0 --output .tmp/standard-taxonomy-evaluation.json
      - name: Verify
        run: npm run verify

  browser-e2e:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Chromium browser E2E
        run: npm run test:e2e
      - name: iPhone WebKit smoke
        run: npm run test:e2e:webkit

  ai-director-multisource-split:
    if: github.head_ref == 'exp/ai-director-multisource-split'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout experiment PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dataset client and ffmpeg
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q huggingface_hub
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render actual sid013 and sid017 cross-model split edits
        run: python scripts/ai_director_multisource_split.py
      - name: Upload cross-model split evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-director-multisource-split
          path: .tmp/ai-director-multisource-split
          if-no-files-found: error
          retention-days: 3
