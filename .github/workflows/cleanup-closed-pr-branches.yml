name: Cleanup closed PR branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete closed-PR and fully merged no-PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repo = process.env.REPO;
          const owner = process.env.OWNER;
          const protectedBranches = new Set(['main', 'v1', 'perf/threejs-repository-instancing']);
          async function api(path, init = {}) {
            const r = await fetch(`https://api.github.com${path}`, {
              ...init,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            if (!r.ok) throw new Error(`${init.method || 'GET'} ${path}: ${r.status} ${await r.text()}`);
            return r.status === 204 ? null : r.json();
          }
          const esc = s => s.split('/').map(encodeURIComponent).join('/');
          const refPath = name => `/repos/${repo}/git/refs/heads/${esc(name)}`;
          const compare = (base, head) => api(`/repos/${repo}/compare/${esc(base)}...${esc(head)}`);
          const branches = [];
          for (let page = 1; ; page++) {
            const batch = await api(`/repos/${repo}/branches?per_page=100&page=${page}`);
            branches.push(...batch);
            if (batch.length < 100) break;
          }
          const out = {deletedClosedPr: [], deletedMergedNoPr: [], keptUnmergedNoPr: [], skippedOpen: [], skippedProtected: []};
          for (const {name} of branches) {
            if (protectedBranches.has(name)) { out.skippedProtected.push(name); continue; }
            const q = new URLSearchParams({state: 'all', head: `${owner}:${name}`, per_page: '100'});
            const prs = await api(`/repos/${repo}/pulls?${q}`);
            if (prs.some(pr => pr.state === 'open')) { out.skippedOpen.push(name); continue; }
            if (prs.length) {
              await api(refPath(name), {method: 'DELETE'});
              out.deletedClosedPr.push(name);
              console.log(`DELETED_CLOSED_PR ${name}`);
              continue;
            }
            let merged = false;
            for (const target of ['main', 'v1']) {
              const c = await compare(name, target);
              if (c.ahead_by === 0) { merged = true; break; }
            }
            if (merged) {
              await api(refPath(name), {method: 'DELETE'});
              out.deletedMergedNoPr.push(name);
              console.log(`DELETED_MERGED_NO_PR ${name}`);
            } else {
              out.keptUnmergedNoPr.push(name);
            }
          }
          console.log(`CLEANUP_RESULT ${JSON.stringify({...out, deletedCount: out.deletedClosedPr.length + out.deletedMergedNoPr.length})}`);
          NODE
