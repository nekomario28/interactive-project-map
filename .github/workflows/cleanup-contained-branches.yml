name: Cleanup fully contained branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only closed-PR or fully contained branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repo = process.env.REPO;
          const owner = process.env.OWNER;
          const keep = new Set(['main','v1','perf/threejs-repository-instancing']);
          async function api(path, init={}) {
            const r = await fetch(`https://api.github.com${path}`, {
              ...init,
              headers: {Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'}
            });
            if (!r.ok) throw new Error(`${init.method||'GET'} ${path}: ${r.status} ${await r.text()}`);
            return r.status===204 ? null : r.json();
          }
          const esc=s=>s.split('/').map(encodeURIComponent).join('/');
          const branches=[];
          for(let p=1;;p++){
            const x=await api(`/repos/${repo}/branches?per_page=100&page=${p}`);
            branches.push(...x); if(x.length<100) break;
          }
          const result={deletedClosedPr:[],deletedContained:[],keptUnique:[],protected:[]};
          for(const {name} of branches){
            if(keep.has(name)){result.protected.push(name);continue;}
            const q=new URLSearchParams({state:'all',head:`${owner}:${name}`,per_page:'100'});
            const prs=await api(`/repos/${repo}/pulls?${q}`);
            if(prs.some(p=>p.state==='open')){result.protected.push(name);continue;}
            if(prs.length){
              await api(`/repos/${repo}/git/refs/heads/${esc(name)}`,{method:'DELETE'});
              result.deletedClosedPr.push(name); console.log(`DELETED_CLOSED_PR ${name}`); continue;
            }
            let contained=false;
            for(const target of ['main','v1']){
              const c=await api(`/repos/${repo}/compare/${esc(name)}...${esc(target)}`);
              if(c.behind_by===0){contained=true;break;}
            }
            if(contained){
              await api(`/repos/${repo}/git/refs/heads/${esc(name)}`,{method:'DELETE'});
              result.deletedContained.push(name); console.log(`DELETED_CONTAINED ${name}`);
            } else result.keptUnique.push(name);
          }
          console.log(`CLEANUP_RESULT ${JSON.stringify({...result,deletedCount:result.deletedClosedPr.length+result.deletedContained.length})}`);
          NODE
