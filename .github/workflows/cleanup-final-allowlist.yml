name: Cleanup final redundant branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact redundant branch allowlist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const token=process.env.GH_TOKEN, repo=process.env.REPO;
          const names=[
            'dedicated-status-projection2',
            'tmp/rebase-threejs-performance-after-view-model',
            'tmp/v1-halo-release-pin-materialize-20260825'
          ];
          for(const name of names){
            const path=name.split('/').map(encodeURIComponent).join('/');
            const r=await fetch(`https://api.github.com/repos/${repo}/git/refs/heads/${path}`,{
              method:'DELETE',
              headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28'}
            });
            if(r.status!==204 && r.status!==422) throw new Error(`${name}: ${r.status} ${await r.text()}`);
            console.log(`${r.status===204?'DELETED':'ALREADY_GONE'} ${name}`);
          }
          NODE
