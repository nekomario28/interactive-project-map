name: Cleanup merged P1A branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'nekomario28/interactive-project-map'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Delete merged branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in feat/p1a-readme-enrichment chore/pin-p1a-action; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
