name: TEMP cosmic center-relative delta patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'fix/cosmic-sequential-anchor-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/cosmic-sequential-anchor-20260825
          fetch-depth: 0
      - name: Apply exact center-relative delta correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/public-cosmic-background.js')
          text = path.read_text()
          old = '''    const deltaX = current.originX - ratio * previous.originX;\n    const deltaY = current.originY - ratio * previous.originY;'''
          new = '''    const deltaX = current.originX - ratio * previous.originX + (ratio - 1) * current.width / 2;\n    const deltaY = current.originY - ratio * previous.originY + (ratio - 1) * current.height / 2;'''
          if old not in text:
              print('center-relative delta patch already applied')
              raise SystemExit(0)
          path.write_text(text.replace(old, new))
          PY
          if git diff --quiet -- scripts/public-cosmic-background.js; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/public-cosmic-background.js
          git commit -m 'Use center-relative camera deltas for cosmic depth'
          git push origin HEAD:fix/cosmic-sequential-anchor-20260825
