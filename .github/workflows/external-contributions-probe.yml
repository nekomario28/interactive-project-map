name: External contributions probe

on:
  pull_request:
    paths:
      - .github/workflows/external-contributions-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public cross-repository contribution visibility
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_USER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.GITHUB_TOKEN;
          const login = process.env.TARGET_USER;
          const query = `
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  commitContributionsByRepository(maxRepositories: 100) {
                    repository { nameWithOwner isPrivate isFork owner { login } url }
                    contributions(first: 100) {
                      nodes { commitCount occurredAt isRestricted }
                    }
                  }
                  pullRequestContributionsByRepository(maxRepositories: 100) {
                    repository { nameWithOwner isPrivate isFork owner { login } url }
                    contributions(first: 100) {
                      totalCount
                      nodes {
                        isRestricted
                        pullRequest { number state mergedAt url }
                      }
                    }
                  }
                }
              }
            }
          `;
          const response = await fetch("https://api.github.com/graphql", {
            method: "POST",
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
              "User-Agent": "interactive-project-map-contribution-probe",
            },
            body: JSON.stringify({ query, variables: { login } }),
          });
          const payload = await response.json();
          if (!response.ok || payload.errors?.length || !payload.data?.user) {
            throw new Error(`GraphQL probe failed: HTTP ${response.status}; ${JSON.stringify(payload.errors ?? [])}`);
          }
          const collection = payload.data.user.contributionsCollection;
          const byRepo = new Map();
          const ensure = (repository) => {
            if (!repository || repository.isPrivate || repository.owner?.login?.toLowerCase() === login.toLowerCase()) return null;
            const key = repository.nameWithOwner;
            if (!byRepo.has(key)) byRepo.set(key, { repository: key, url: repository.url, fork: repository.isFork, commits: 0, pullRequests: 0, mergedPullRequests: 0 });
            return byRepo.get(key);
          };
          for (const row of collection.commitContributionsByRepository ?? []) {
            const item = ensure(row.repository);
            if (!item) continue;
            item.commits += (row.contributions?.nodes ?? []).filter((node) => !node.isRestricted).reduce((sum, node) => sum + (node.commitCount ?? 0), 0);
          }
          for (const row of collection.pullRequestContributionsByRepository ?? []) {
            const item = ensure(row.repository);
            if (!item) continue;
            const visible = (row.contributions?.nodes ?? []).filter((node) => !node.isRestricted && node.pullRequest);
            item.pullRequests += visible.length;
            item.mergedPullRequests += visible.filter((node) => node.pullRequest.mergedAt).length;
          }
          const external = [...byRepo.values()].filter((item) => item.commits > 0 || item.pullRequests > 0).sort((a, b) => b.mergedPullRequests - a.mergedPullRequests || b.commits - a.commits || b.pullRequests - a.pullRequests || a.repository.localeCompare(b.repository));
          console.log(JSON.stringify({ login, externalRepositoryCount: external.length, repositories: external }, null, 2));
          if (!external.length) throw new Error("No public external contribution repositories were visible to the read-only Actions token");
          NODE
