name: Generate npm lockfile once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.repository == 'nekomario28/interactive-project-map' && github.head_ref == 'chore/reproducible-npm-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate lockfile reproducibly
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock npm dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
