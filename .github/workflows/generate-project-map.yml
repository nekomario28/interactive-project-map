name: Generate project map

on:
  workflow_call:
    inputs:
      theme:
        description: Static profile SVG theme
        required: true
        type: string
      style:
        description: Project-map style
        required: true
        type: string
      max_repos:
        description: Maximum repositories to include
        required: true
        type: string
      forks:
        description: Include fork repositories in generated data
        required: true
        type: boolean
      archived:
        description: Include archived repositories in generated data
        required: true
        type: boolean
      contributed:
        description: Include bounded accepted public contributions to repositories owned by others
        required: false
        default: false
        type: boolean
      svg_contributed_layout:
        description: Galaxy Systems Contributed layout (rail or halo); omitted legacy workflow inputs keep Halo
        required: false
        default: halo
        type: string
      width:
        description: SVG width in pixels
        required: false
        default: "740"
        type: string
      height:
        description: SVG height (auto, or a fixed pixel height)
        required: false
        default: auto
        type: string
      padding:
        description: Padding around the fitted Galaxy graph in pixels
        required: false
        default: "24"
        type: string

permissions:
  contents: read

# Release chain:
# - OUTER release target: this reusable workflow, consumed as @v1 or an explicit workflow commit SHA.
# - INNER release target: the immutable Project Map Action SHA in the Generate project map step below.
# Advancing @v1 alone never advances the inner Action. Update and verify the inner pin first,
# then promote @v1 to the reviewed reusable-workflow commit.
#
# Immutable Action candidate: cb58ea19bb7f1d09778924a38949f0074108b234. Both Halo and Rail share one renderer.
# Backward compatibility: earlier v1 callers with no layout input used Halo for Galaxy Systems.
# Reusable workflows default to Halo, while direct Action callers keep their existing Rail default.
# Explicit halo/rail remains authoritative for new callers.
# Verify exact caller behavior before promoting the stable v1 channel.
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate project map
        uses: nekomario28/interactive-project-map@cb58ea19bb7f1d09778924a38949f0074108b234
        with:
          github_token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          theme: ${{ inputs.theme }}
          style: ${{ inputs.style }}
          max_repos: ${{ inputs.max_repos }}
          forks: ${{ inputs.forks }}
          archived: ${{ inputs.archived }}
          contributed: ${{ inputs.contributed }}
          svg_contributed_layout: ${{ inputs.svg_contributed_layout }}
          width: ${{ inputs.width }}
          height: ${{ inputs.height }}
          padding: ${{ inputs.padding }}
          output_dir: project-map

      - name: Transfer generated files to publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-map-generated
          path: project-map
          if-no-files-found: error
          retention-days: 1
