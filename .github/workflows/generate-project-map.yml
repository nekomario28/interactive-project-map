name: Generate project map

on:
  workflow_call:
    inputs:
      theme:
        description: Static profile SVG theme
        required: true
        type: string
      style:
        description: Project-map style
        required: true
        type: string
      max_repos:
        description: Maximum repositories to include
        required: true
        type: string
      forks:
        description: Include fork repositories in generated data
        required: true
        type: boolean
      archived:
        description: Include archived repositories in generated data
        required: true
        type: boolean
      contributed:
        description: Include bounded accepted public contributions to repositories owned by others
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Release chain:
# - OUTER release target: this reusable workflow, consumed as @v1 or an explicit workflow commit SHA.
# - INNER release target: the immutable Project Map Action SHA in the Generate project map step below.
# Advancing @v1 alone never advances the inner Action. Update and verify the inner pin first,
# then promote @v1 to the reviewed reusable-workflow commit.
#
# Galaxy Systems Contributed external-rail release: Action 94abe621aae576d6a49e38fe7e146e0790387fc2 passed
# Verify #780, including the 12-Contributed rail regression, full verify,
# Chromium and iPhone WebKit. Contributed remains outside owned category motion.
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate project map
        uses: nekomario28/interactive-project-map@94abe621aae576d6a49e38fe7e146e0790387fc2
        with:
          github_token: ${{ github.token }}
          username: ${{ github.repository_owner }}
          theme: ${{ inputs.theme }}
          style: ${{ inputs.style }}
          max_repos: ${{ inputs.max_repos }}
          forks: ${{ inputs.forks }}
          archived: ${{ inputs.archived }}
          contributed: ${{ inputs.contributed }}
          output_dir: project-map

      - name: Transfer generated files to publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-map-generated
          path: project-map
          if-no-files-found: error
          retention-days: 1
