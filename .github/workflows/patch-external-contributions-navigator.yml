name: Patch external contributions navigator

on:
  push:
    branches: [fix/external-contributions-navigator]
    paths:
      - ".github/workflows/patch-external-contributions-navigator.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/external-contributions-navigator

      - name: Apply bounded source and regression patches
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          # Browser sanitizers must enforce the same accepted-work contract as the generator.
          for path in [
              "scripts/apply-contributed-viewer.mjs",
              "scripts/apply-contributed-dedicated-viewers.mjs",
          ]:
              replace_once(
                  path,
                  "if (commits === 0 && pullRequests === 0) return null;",
                  "if (commits === 0 && mergedPullRequests === 0) return null;",
              )

          replace_once(
              "tests/contributed-viewer-adapter.test.mjs",
              "  assert.match(patched, /raw\\.relation !== \"contributed\"/);\n",
              "  assert.match(patched, /raw\\.relation !== \"contributed\"/);\n  assert.match(patched, /commits === 0 && mergedPullRequests === 0/);\n",
          )
          replace_once(
              "tests/contributed-dedicated-viewer-adapter.test.mjs",
              "    assert.match(patched, /raw\\.relation !== \"contributed\"/);\n",
              "    assert.match(patched, /raw\\.relation !== \"contributed\"/);\n    assert.match(patched, /commits === 0 && mergedPullRequests === 0/);\n",
          )

          nav = Path("scripts/public-category-navigator.js")
          text = nav.read_text()
          old = '''  function nodeSearchText(node) {\n'''
          addition = '''  function externalRepositories() {\n    return graphNodes()\n      .filter((node) => node?.type === "repository"\n        && node?.relation === "contributed"\n        && repositoryVisible(node))\n      .sort((a, b) => String(a.label || "").localeCompare(String(b.label || "")));\n  }\n\n'''
          if addition not in text:
              if old not in text:
                  raise SystemExit("missing externalRepositories insertion anchor")
              text = text.replace(old, addition + old, 1)

          old = '''  function render({ force = false } = {}) {\n'''
          addition = '''  function createExternalEntry(repositories, query) {\n    const sectionKey = "external:contributions";\n    const activeId = activeFocusId();\n    const searchOpen = Boolean(query) && repositories.some((repo) => nodeSearchText(repo).includes(query));\n    const expanded = manualExpanded.has(sectionKey)\n      || repositories.some((repo) => repo.id === activeId)\n      || searchOpen;\n\n    const section = document.createElement("section");\n    section.className = "category-nav-group category-nav-external";\n    section.dataset.externalContributions = "true";\n    section.setAttribute("aria-label", "External contributions, not an owned category");\n\n    const row = document.createElement("div");\n    row.className = "category-nav-row";\n\n    const heading = document.createElement("div");\n    heading.className = "category-nav-focus";\n    heading.setAttribute("role", "heading");\n    heading.setAttribute("aria-level", "3");\n    heading.title = "External contributions are shown separately and are not part of an owned category.";\n    heading.innerHTML = `<span>External contributions</span><small>${repositories.length} · not owned</small>`;\n\n    const disclosure = document.createElement("button");\n    disclosure.type = "button";\n    disclosure.className = "category-nav-disclosure";\n    disclosure.setAttribute("aria-expanded", String(expanded));\n    disclosure.setAttribute("aria-label", `${expanded ? "Collapse" : "Expand"} external contribution repositories`);\n    disclosure.textContent = expanded ? "−" : "+";\n    disclosure.addEventListener("click", () => {\n      if (manualExpanded.has(sectionKey)) manualExpanded.delete(sectionKey);\n      else manualExpanded.add(sectionKey);\n      render({ force: true });\n    });\n\n    row.append(heading, disclosure);\n    section.append(row);\n\n    const repoList = document.createElement("div");\n    repoList.className = "category-nav-repositories";\n    repoList.hidden = !expanded;\n    for (const repo of repositories) {\n      const match = !query || nodeSearchText(repo).includes(query);\n      const button = document.createElement("button");\n      button.type = "button";\n      button.className = "category-nav-repository";\n      button.dataset.repositoryId = repo.id;\n      button.setAttribute("aria-label", `${repo.label}, external contribution`);\n      button.setAttribute("aria-pressed", String(activeId === repo.id));\n      if (query && match) button.classList.add("is-search-match");\n      if (query && !match) button.classList.add("is-search-muted");\n      button.innerHTML = `<span>${repo.label}</span><small>${repo.language || "External"}</small>`;\n      button.addEventListener("click", () => toggleFocusNode(repo.id));\n      repoList.append(button);\n    }\n    section.append(repoList);\n    return section;\n  }\n\n'''
          if addition not in text:
              if old not in text:
                  raise SystemExit("missing createExternalEntry insertion anchor")
              text = text.replace(old, addition + old, 1)

          old = '''      const signature = groupSignature(groups.map(({ group }) => group));\n      const query = userQuery();\n'''
          new = '''      const external = externalRepositories();\n      const signature = `${groupSignature(groups.map(({ group }) => group))}::external:${external.map((repo) => repo.id).join(",")}`;\n      const query = userQuery();\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("missing render signature anchor")
              text = text.replace(old, new, 1)

          old = '''      if (!groups.length) {\n        summary.textContent = state.graph ? "No visible categories" : "Loading…";\n'''
          new = '''      if (!groups.length && !external.length) {\n        summary.textContent = state.graph ? "No visible repositories" : "Loading…";\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("missing empty-state anchor")
              text = text.replace(old, new, 1)

          old = '''      summary.textContent = fallbackFocus\n        ? `${groups.length} categories · Focus: ${fallbackFocus.label}`\n        : `${groups.length} categories · ${repositoryTotal} repos`;\n'''
          new = '''      if (external.length) list.append(createExternalEntry(external, query));\n      summary.textContent = fallbackFocus\n        ? `${groups.length} categories · Focus: ${fallbackFocus.label}`\n        : external.length\n          ? `${groups.length} categories · ${repositoryTotal} owned · ${external.length} external`\n          : `${groups.length} categories · ${repositoryTotal} repos`;\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("missing summary anchor")
              text = text.replace(old, new, 1)
          nav.write_text(text)

          replace_once(
              "tests/category-navigator.test.mjs",
              "    assert.match(runtime, /focusCategory/);\n",
              "    assert.match(runtime, /focusCategory/);\n    assert.match(runtime, /externalRepositories/);\n    assert.match(runtime, /externalContributions/);\n    assert.match(runtime, /not owned/);\n",
          )

          e2e = Path("tests/e2e/category-navigator.spec.mjs")
          text = e2e.read_text()
          anchor = '''};\n\nasync function installFixture(page) {\n'''
          addition = '''};\n\nconst externalGraph = {\n  ...graph,\n  contributedRepositoryCount: 1,\n  externalContributions: {\n    window: { from: "2025-08-22T00:00:00Z", to: "2026-08-22T00:00:00Z" },\n    cap: 4,\n    candidateRepositories: 1,\n    includedRepositories: 1,\n    omittedRepositories: 0,\n    truncatedRepositories: 0,\n  },\n  nodes: [\n    ...graph.nodes,\n    {\n      id: "repository:other/ext",\n      label: "other/ext",\n      type: "repository",\n      relation: "contributed",\n      repositoryOwner: "other",\n      repositoryName: "ext",\n      url: "https://github.com/other/ext",\n      description: "accepted external work",\n      language: "Python",\n      topics: ["robotics"],\n      stars: 2,\n      forks: 0,\n      fork: false,\n      archived: false,\n      createdAt: "2026-07-01T00:00:00Z",\n      updatedAt: "2026-08-01T00:00:00Z",\n      contribution: { commits: 0, pullRequests: 1, mergedPullRequests: 1, commitsTruncated: false, pullRequestsTruncated: false },\n    },\n  ],\n};\n\nasync function installFixture(page) {\n'''
          if "const externalGraph =" not in text:
              if anchor not in text:
                  raise SystemExit("missing externalGraph insertion anchor")
              text = text.replace(anchor, addition, 1)

          anchor = '''async function openNavigator(page) {\n'''
          helper = '''async function installExternalFixture(page) {\n  await page.route("https://raw.githubusercontent.com/example/example/HEAD/project-map/graph.json", async (route) => {\n    await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(externalGraph) });\n  });\n}\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit("missing external fixture helper anchor")
              text = text.replace(anchor, helper + anchor, 1)

          test_block = '''\ntest("Contributed appears in a separate non-owned navigator section", async ({ page }) => {\n  await page.setViewportSize({ width: 1200, height: 760 });\n  await installExternalFixture(page);\n  await page.goto("/u/?username=example&style=galaxy-systems");\n  await expect(page.locator("#status")).toBeHidden();\n\n  const navigator = await openNavigator(page);\n  await expect(page.locator("#categoryNavigatorSummary")).toHaveText("2 categories · 4 owned · 1 external");\n  const external = navigator.locator('[data-external-contributions="true"]');\n  await expect(external).toHaveCount(1);\n  await expect(external).toContainText("External contributions");\n  await expect(external).toContainText("not owned");\n  await expect(external.locator(".category-nav-repositories")).toBeHidden();\n\n  await external.locator(".category-nav-disclosure").click();\n  const repo = external.locator('[data-repository-id="repository:other/ext"]');\n  await expect(repo).toBeVisible();\n  await repo.click();\n  await expect(repo).toHaveAttribute("aria-pressed", "true");\n  await expect(page.locator("#detailsTitle")).toHaveText("other/ext");\n  await expect(page.locator("#detailsMeta")).toContainText("Contributed");\n\n  await page.getByRole("button", { name: /^Contributed repositories: 1/ }).click();\n  await expect(navigator.locator('[data-external-contributions="true"]')).toHaveCount(0);\n  await expect(page.locator("#categoryNavigatorSummary")).toHaveText("2 categories · 4 repos");\n});\n'''
          if 'test("Contributed appears in a separate non-owned navigator section"' not in text:
              text += test_block
          e2e.write_text(text)
          PY

          rm .github/workflows/patch-external-contributions-navigator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/apply-contributed-viewer.mjs scripts/apply-contributed-dedicated-viewers.mjs scripts/public-category-navigator.js tests/contributed-viewer-adapter.test.mjs tests/contributed-dedicated-viewer-adapter.test.mjs tests/category-navigator.test.mjs tests/e2e/category-navigator.spec.mjs .github/workflows/patch-external-contributions-navigator.yml
          git commit -m "Expose external contributions in category navigation"
          git push origin HEAD:fix/external-contributions-navigator
