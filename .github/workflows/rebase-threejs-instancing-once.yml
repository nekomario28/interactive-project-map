name: Rebase Three.js instancing once

on:
  push:
    branches:
      - perf/threejs-repository-instancing-rebase

permissions:
  contents: write

jobs:
  rebase-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fresh main-based experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reapply the evidence-gated prototype
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin perf/threejs-repository-instancing
          git show FETCH_HEAD:scripts/apply-threejs-repository-instancing.mjs > scripts/apply-threejs-repository-instancing.mjs
          git show FETCH_HEAD:tests/threejs-repository-instancing.test.mjs > tests/threejs-repository-instancing.test.mjs
          python - <<'PY'
          from pathlib import Path

          package = Path('package.json')
          text = package.read_text()
          old_check = 'node --check scripts/apply-threejs-style-presets.mjs && node --check scripts/apply-threejs-local-engine.mjs'
          new_check = 'node --check scripts/apply-threejs-style-presets.mjs && node --check scripts/apply-threejs-repository-instancing.mjs && node --check scripts/apply-threejs-local-engine.mjs'
          old_build = 'node scripts/apply-threejs-style-presets.mjs && node scripts/apply-threejs-local-engine.mjs'
          new_build = 'node scripts/apply-threejs-style-presets.mjs && node scripts/apply-threejs-repository-instancing.mjs && node scripts/apply-threejs-local-engine.mjs'
          if old_check not in text or old_build not in text:
              raise SystemExit('package.json Three.js build boundary changed; refusing to patch')
          package.write_text(text.replace(old_check, new_check, 1).replace(old_build, new_build, 1))

          patch = Path('scripts/apply-threejs-repository-instancing.mjs')
          source = patch.read_text()
          loose_total = 'graph.nodes.filter((node)=>node.type==\\"repository\\").length'
          strict_total = 'graph.nodes.filter((node)=>node.type===\\"repository\\").length'
          loose_pulse = 'node.type==\\"repository\\"?.025:.018'
          strict_pulse = 'node.type===\\"repository\\"?.025:.018'
          if loose_total not in source or loose_pulse not in source:
              raise SystemExit('expected legacy instancing anchors not found; refusing broad rewrite')
          patch.write_text(source.replace(loose_total, strict_total).replace(loose_pulse, strict_pulse))

          fixture = Path('tests/threejs-repository-instancing.test.mjs')
          test_source = fixture.read_text()
          test_source = test_source.replace('node.type==\\"repository\\"', 'node.type===\\"repository\\"')
          test_source = test_source.replace('node.type=="repository"', 'node.type==="repository"')
          fixture.write_text(test_source)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Full verification before preserving prototype
        id: verify
        shell: bash
        run: |
          set +e
          npm run verify > verify.log 2>&1
          status=$?
          echo "$status" > verify.status
          cat verify.log
          exit "$status"

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: threejs-instancing-rebase-diagnostics
          path: |
            verify.log
            verify.status
            package.json
            scripts/apply-threejs-repository-instancing.mjs
            tests/threejs-repository-instancing.test.mjs
          if-no-files-found: error
          retention-days: 1

      - name: Commit verified fresh-main prototype
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rebase-threejs-instancing-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json scripts/apply-threejs-repository-instancing.mjs tests/threejs-repository-instancing.test.mjs .github/workflows/rebase-threejs-instancing-once.yml
          git commit -m 'perf: rebase Three.js repository instancing on current main'
          git push origin HEAD:perf/threejs-repository-instancing-rebase
