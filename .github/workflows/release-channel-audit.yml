name: Audit stable v1 release channel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-project-map.yml"
      - ".github/workflows/release-channel-audit.yml"
      - "src/action-ref.ts"
      - "scripts/audit-release-channel.mjs"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit stable v1 branch against immutable inner Action
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/audit-release-channel.mjs --output .tmp/release-channel-audit.json

      - name: Upload release-chain evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-channel-audit
          path: .tmp/release-channel-audit.json
          if-no-files-found: error
          retention-days: 14
