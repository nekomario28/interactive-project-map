name: Exact SVG framing release proof
on:
  push:
    branches: [release/svg-frame-proof-20261004]
permissions:
  contents: read
jobs:
  generate:
    uses: nekomario28/interactive-project-map/.github/workflows/generate-project-map.yml@9b062afdf8e7a0ff64c4a58d5e1c398ab7626704
    with:
      theme: dark
      style: galaxy-systems
      max_repos: "100"
      forks: true
      archived: true
      contributed: true
  verify:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9b062afdf8e7a0ff64c4a58d5e1c398ab7626704
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: project-map-generated
          path: project-map
      - name: Validate real profile and default framing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const svg = fs.readFileSync('project-map/galaxy.svg', 'utf8');
          const graph = JSON.parse(fs.readFileSync('project-map/graph.json', 'utf8'));
          const owner = 'nekomario28';
          const contributed = graph.nodes.filter((node) => node?.type === 'repository' && node?.relation === 'contributed');
          const contributedIds = new Set(contributed.map((node) => node.id));

          if (contributed.length < 1) throw new Error('canonical map has no accepted Contributed repositories');
          if (graph.contributedRepositoryCount !== contributed.length) throw new Error('Contributed count mismatch');
          if (graph.externalContributions?.includedRepositories !== contributed.length) throw new Error('Contributed diagnostics mismatch');
          for (const node of contributed) {
            if (!node.repositoryOwner || !node.repositoryName || String(node.repositoryOwner).toLowerCase() === owner) throw new Error('invalid external repository identity');
            if ('groupId' in node || 'groupLabel' in node) throw new Error('Contributed repository gained owned category membership');
            const commits = Number(node.contribution?.commits || 0);
            const merged = Number(node.contribution?.mergedPullRequests || 0);
            if (commits < 1 && merged < 1) throw new Error(`pending-only repository admitted as Contributed: ${node.label}`);
          }
          if (graph.edges.some((edge) => ['ownership', 'membership'].includes(edge?.type) && contributedIds.has(edge?.target))) throw new Error('ownership path reaches Contributed repository');
          const contributionTargets = new Set(graph.edges.filter((edge) => edge?.type === 'contribution').map((edge) => edge.target));
          for (const id of contributedIds) if (!contributionTargets.has(id)) throw new Error(`missing canonical contribution edge for ${id}`);
          if ((graph.semanticEdges || []).some((edge) => contributedIds.has(edge?.source) || contributedIds.has(edge?.target))) throw new Error('Contributed repository entered owned semantic graph');

          if (!svg.includes('id="galaxy-family-bg"') || !svg.includes('fill="url(#galaxy-family-bg)"')) {
            throw new Error('native IPM Galaxy background is missing');
          }
          if (/data-profile-galaxy-|ead72debca2a16608ebc5b799993c0234ea10cab/.test(svg)) {
            throw new Error('profile-local historical donor markers survived the rollback');
          }
          if (/parallax|meteor/i.test(svg)) throw new Error('interactive screen-space background decoration leaked into static SVG output');

          const haloStart = svg.indexOf('data-galaxy-external-layout="halo"');
          if (haloStart < 0) throw new Error('Galaxy Systems external halo is missing');
          const haloSlice = svg.slice(haloStart);
          const placements = [...haloSlice.matchAll(/data-galaxy-orbit="contributed" data-galaxy-placement="external-halo-orbit" data-galaxy-lane="([0-9]+)" data-galaxy-radius="([0-9.]+)"/g)];
          if (placements.length !== contributed.length) throw new Error(`external halo placement mismatch: ${placements.length} SVG vs ${contributed.length} graph`);
          if (!/<animateTransform\b/.test(haloSlice)) throw new Error('living external halo is missing orbit animation');

          const byLane = new Map();
          for (const match of placements) {
            const lane = Number(match[1]);
            const radius = Number(match[2]);
            if (!Number.isFinite(lane) || !Number.isFinite(radius)) throw new Error('invalid Contributed halo geometry');
            if (!byLane.has(lane)) byLane.set(lane, []);
            byLane.get(lane).push(radius);
          }
          const lanes = [...byLane.keys()].sort((a, b) => a - b);
          for (let index = 1; index < lanes.length; index += 1) {
            const previous = byLane.get(lanes[index - 1]);
            const current = byLane.get(lanes[index]);
            if (Math.min(...current) <= Math.max(...previous)) throw new Error('later Contributed halo lane did not expand outward');
          }

          const forbiddenKeys = new Set(['private', 'isPrivate', 'restricted', 'isRestricted']);
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (forbiddenKeys.has(key)) throw new Error(`forbidden privacy key serialized: ${key}`);
              visit(child);
            }
          };
          visit(graph);
          console.log(`Direct native IPM profile validated: ${graph.repositoryCount} owned + ${contributed.length} Contributed; native background + shared external halo + inherited sans font`);
          const service = graph.nodes.find((node) => node.label === 'lime_tidyup');
          const facets = service?.taxonomyAssignment?.secondaryTags || [];
          if (service?.taxonomyAssignment?.categoryId !== 'robotics-automation' || !facets.includes('artifact:service') || facets.includes('artifact:documentation') || !facets.includes('ecosystem:ros2') || !facets.includes('topic:gazebo')) throw new Error('Current production taxonomy fix regressed');
          console.log('PRODUCTION_TAXONOMY_PRESERVED lime_tidyup service ROS2 Gazebo');
          const dimensions = svg.match(/width="(\d+)" height="(\d+)"/);
          if (!dimensions || Number(dimensions[1]) !== 740 || Number(dimensions[2]) <= 420) throw new Error('Default auto height did not grow to fit the live profile');
          if (!svg.includes('data-galaxy-fit="true"')) throw new Error('Automatic graph fit is absent');
          const ownedMarkers = (svg.match(/data-galaxy-orbit="repository"/g) || []).length;
          if (ownedMarkers !== graph.repositoryCount) throw new Error('Owned repository planets were lost during fitting');
          console.log(`AUTO_FRAME_RELEASE_PASS width=${dimensions[1]} height=${dimensions[2]}`);
          (async () => {
            const { renderGalaxySystemsSvg } = await import('./scripts/galaxy-svg-systems.mjs');
            const expected = renderGalaxySystemsSvg(graph, 'dark', 740, 420, { height: 'auto', padding: 24 });
            if (svg !== expected) throw new Error('Default framing did not reach the Action exactly');
            console.log('DEFAULT_FRAME_INPUTS_PASS width=740 height=auto padding=24');
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: node scripts/render-preset-comparison.mjs project-map/graph.json .tmp/preset-comparison
  browser:
    needs: verify
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9b062afdf8e7a0ff64c4a58d5e1c398ab7626704
      - run: npm ci --ignore-scripts
      - run: npm run test:e2e
      - run: npm run test:e2e:webkit
