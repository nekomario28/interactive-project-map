name: Update public user count

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 09:17 Asia/Tokyo.
  workflow_dispatch:
    inputs:
      username:
        description: Optional public account to verify before GitHub search indexes it
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: public-user-count
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.repository == 'nekomario28/interactive-project-map' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout census revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test census behavior
        run: node --test tests/public-users.test.mjs

      - name: Verify public installations
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDE_USERNAME: ${{ inputs.username }}
        run: |
          if [[ -n "${INCLUDE_USERNAME}" ]]; then
            npm run update:users -- --include "${INCLUDE_USERNAME}"
          else
            npm run update:users
          fi

      - name: Check README count
        run: npm run check:users

      - name: Transfer verified count
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-user-count
          path: |
            README.md
            data/public-users.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout the verified base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download verified count
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-user-count
          path: .

      - name: Validate downloaded count
        run: npm run check:users

      - name: Commit the two generated files
        run: |
          if git diff --quiet -- README.md data/public-users.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md data/public-users.json
          git commit -m "Refresh verified public user count" -- README.md data/public-users.json
          # A moved main rejects this push; never overwrite newer work or force-push.
          git push origin HEAD:main
