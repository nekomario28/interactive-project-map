name: Generate Interactive Project Map

description: Generate a static galaxy SVG and graph JSON from a GitHub user's public repositories.

author: nekomario28

inputs:
  username:
    description: GitHub username to visualize. Defaults to the caller repository owner.
    required: false
    default: ""
  theme:
    description: SVG theme (dark or light).
    required: false
    default: dark
  max_repos:
    description: Maximum eligible repositories to include (1-300).
    required: false
    default: "100"
  forks:
    description: Include forked repositories.
    required: false
    default: "true"
  archived:
    description: Include archived repositories.
    required: false
    default: "false"
  width:
    description: SVG width (420-1600).
    required: false
    default: "740"
  height:
    description: SVG height (260-1000).
    required: false
    default: "420"
  output_dir:
    description: Relative directory in the caller workspace for generated files.
    required: false
    default: project-map

outputs:
  svg-path:
    description: Relative path to the generated SVG.
    value: ${{ steps.generate.outputs.svg-path }}
  graph-path:
    description: Relative path to the generated graph JSON.
    value: ${{ steps.generate.outputs.graph-path }}

runs:
  using: composite
  steps:
    - id: generate
      name: Generate static project map
      shell: bash
      env:
        PROJECT_MAP_USERNAME: ${{ inputs.username }}
        PROJECT_MAP_THEME: ${{ inputs.theme }}
        PROJECT_MAP_MAX_REPOS: ${{ inputs.max_repos }}
        PROJECT_MAP_FORKS: ${{ inputs.forks }}
        PROJECT_MAP_ARCHIVED: ${{ inputs.archived }}
        PROJECT_MAP_WIDTH: ${{ inputs.width }}
        PROJECT_MAP_HEIGHT: ${{ inputs.height }}
        PROJECT_MAP_OUTPUT_DIR: ${{ inputs.output_dir }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/scripts/action.mjs"

branding:
  icon: share-2
  color: blue
