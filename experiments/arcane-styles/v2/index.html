<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcane IPM v2 prototypes</title><style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#070b12;--panel:#0d131d;--line:#283448;--text:#edf3ff;--muted:#8795aa;--ai:#a981ff;--robot:#f5bd58;--systems:#64d287;--sim:#5bd2f1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}body{width:740px;height:420px}.app{width:740px;height:420px;display:grid;grid-template-columns:560px 180px;grid-template-rows:34px 386px;background:radial-gradient(circle at 45% 50%,#0b1423 0,#070b12 48%,#05070c 100%)}.top{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;border-bottom:1px solid #1f2a3a;background:#080d15;font-size:11px}.brand{font-weight:750;letter-spacing:.2px}.brand span{color:#8aa3c5;font-weight:500;margin-left:7px}.stylebar{display:flex;gap:4px}.stylebar button{height:24px;border:1px solid #283448;background:#0b111b;color:#9eabc0;border-radius:6px;padding:0 7px;font-size:9px}.stylebar button.active{color:white;border-color:#5478a8;background:#132033}.stage{position:relative;overflow:hidden}.stage svg{display:block;width:560px;height:386px}.panel{border-left:1px solid #1d2735;background:linear-gradient(180deg,#0b111a,#080d14);padding:10px 9px 8px;overflow:hidden}.panel h2{font-size:11px;margin:0 0 8px;color:#dce7f8;letter-spacing:.5px}.category{border:1px solid #202c3d;border-radius:7px;margin-bottom:6px;overflow:hidden;background:#0b111a}.cat-head{height:28px;width:100%;display:grid;grid-template-columns:1fr 26px;align-items:center}.cat-focus,.cat-toggle{height:100%;border:0;background:transparent;color:#dbe5f4;font-size:10px;cursor:pointer}.cat-focus{display:grid;grid-template-columns:12px 1fr;align-items:center;text-align:left;padding:0 7px}.cat-toggle{color:#7d8da5;border-left:1px solid #1e2938}.dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 8px currentColor}.chev{text-align:center;color:#7d8da5;font-size:12px}.repo-list{display:none;border-top:1px solid #1e2938;padding:3px}.category.open .repo-list{display:block}.repo-btn{display:block;width:100%;height:23px;border:0;background:transparent;color:#aab7ca;text-align:left;border-radius:4px;padding:0 6px;font-size:9px;cursor:pointer}.repo-btn:hover,.repo-btn.active{background:#121c2a;color:white}.panel .hint{font-size:8px;line-height:1.35;color:#728198;margin:9px 2px 0}.clear{width:100%;height:26px;margin-top:6px;border:1px solid #29374a;background:#101824;color:#c4d0e1;border-radius:6px;font-size:9px}.focus-chip{position:absolute;left:9px;bottom:7px;z-index:3;background:#0a111bcf;border:1px solid #2a3c54;border-radius:12px;padding:4px 8px;font-size:8px;color:#aebbd0;backdrop-filter:blur(6px)}svg text{font-family:inherit}.soft{opacity:.17}.dim{opacity:.18}.edge{stroke:#405067;stroke-width:1;fill:none}.owner{fill:#0b1320;stroke:#7fa1c8;stroke-width:1.5}.ownerText{fill:#f4f8ff;font-weight:800;font-size:18px;text-anchor:middle}.subText{fill:#7f91aa;font-size:6px;letter-spacing:1.2px;text-anchor:middle}.catLabel{font-weight:750;font-size:11px;text-anchor:middle}.repoLabel{fill:#ecf3ff;font-size:8px;font-weight:650;text-anchor:middle}.repoSub{fill:#728198;font-size:5px;text-anchor:middle}.repoNode{fill:#0d1521;stroke-width:1.1}.selectedGlow{filter:url(#glow)}.arcane-bg{fill:none;stroke:#31405a;stroke-width:.55;opacity:.35}.sector-line{stroke:#344359;stroke-width:.65;opacity:.65}.category-ring{fill:none;stroke-width:1.2;opacity:.78}.orbital{fill:none;stroke-width:.7;stroke-dasharray:2 3;opacity:.45}.planet{stroke-width:1}.burst{fill:none;stroke:#d58cff;stroke-width:1.2;opacity:.75;filter:url(#glow)}.burst-ray{stroke:#df9bff;stroke-width:.7;opacity:.7;filter:url(#glow)}.relation{stroke:#d38bff;stroke-width:1.5;fill:none;filter:url(#glow)}</style><div class="app"><header class="top"><div class="brand">YUU / Project Map <span id="styleTitle">Arcane Circle v2</span></div><div class="stylebar" id="stylebar"></div></header><main class="stage"><svg id="map" viewBox="0 0 560 386" role="img" aria-label="Interactive project map"></svg><div class="focus-chip" id="focusChip">No focus · click a category or repository</div></main><aside class="panel"><h2>Categories</h2><div id="categories"></div><button class="clear" id="clearFocus">Clear focus</button><p class="hint">Click category → focus cluster.<br>+/− toggles repo list independently.<br>Click repo → persistent focus.</p></aside></div><script>const DATA=[{id:'ai',name:'AI / LLM',color:'#a981ff',repos:['DeciDelta','Civitas']},{id:'robot',name:'Robotics',color:'#f5bd58',repos:['Isaac Radeon','dual-scorpion']},{id:'systems',name:'Systems',color:'#64d287',repos:['common-runner','microfactory-lab']},{id:'sim',name:'Simulation',color:'#5bd2f1',repos:['Doctravia','lime_tidyup']}];const STYLES=[['arcane','Arcane Circle v2'],['techno','Techno Arcana v2'],['orrery','Celestial Orrery v2'],['detonation','Detonation Focus']];const params=new URLSearchParams(location.search);let style=params.get('style')||'arcane';let focus=params.get('focus')||null;let openCats=new Set(params.get('open')?.split(',').filter(Boolean)||['ai']);const svg=document.getElementById('map'),cats=document.getElementById('categories'),chip=document.getElementById('focusChip');const NS='http://www.w3.org/2000/svg';function S(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!=null)e.textContent=text;return e}function defs(){const d=S('defs');const f=S('filter',{id:'glow',x:'-80%',y:'-80%',width:'260%',height:'260%'});f.append(S('feGaussianBlur',{stdDeviation:'3',result:'b'}));const m=S('feMerge');m.append(S('feMergeNode',{in:'b'}),S('feMergeNode',{in:'SourceGraphic'}));f.append(m);d.append(f);svg.append(d)}function groupDim(cat,repo){if(!focus)return false;if(DATA.some(c=>c.id===focus))return cat!==focus;const fc=DATA.find(c=>c.repos.includes(focus));if(!fc)return false;if(repo===focus)return false;if(style==='detonation'&&focus==='Civitas'&&(repo==='DeciDelta'||cat==='ai'))return false;return cat!==fc.id||repo!==focus}function owner(cx=280,cy=193,r=42){const g=S('g');g.append(S('circle',{cx,cy,r,class:'owner selectedGlow'}));g.append(S('circle',{cx,cy,r:r+8,class:'arcane-bg'}));g.append(S('text',{x:cx,y:cy-2,class:'ownerText'},'YUU'));g.append(S('text',{x:cx,y:cy+13,class:'subText'},'SYSTEM CORE'));svg.append(g)}function repoPill(x,y,w,name,color,cat){const dim=groupDim(cat,name);const g=S('g',{class:dim?'dim':''});g.append(S('rect',{x:x-w/2,y:y-12,width:w,height:24,rx:9,class:'repoNode',stroke:color}));g.append(S('text',{x,y:y+3,class:'repoLabel'},name));g.addEventListener('click',()=>setFocus(name));svg.append(g);return g}function renderArcane(){owner(280,193,40);const cx=280,cy=193,R=161;[R,R-9,80].forEach(r=>svg.append(S('circle',{cx,cy,r,class:'arcane-bg'})));svg.append(S('line',{x1:cx,y1:31,x2:cx,y2:355,class:'sector-line'}),S('line',{x1:119,y1:cy,x2:441,y2:cy,class:'sector-line'}));const cfg={ai:{x:195,y:86},robot:{x:365,y:86},systems:{x:195,y:282},sim:{x:365,y:282}};DATA.forEach(c=>{const p=cfg[c.id],dim=focus&&DATA.some(x=>x.id===focus)&&focus!==c.id;const g=S('g',{class:dim?'dim':''});g.append(S('text',{x:p.x,y:p.y,class:'catLabel',fill:c.color},c.name));g.append(S('line',{x1:p.x-31,y1:p.y+6,x2:p.x+31,y2:p.y+6,stroke:c.color,'stroke-width':.8,opacity:.55}));svg.append(g);const yy=p.y+31;repoPill(p.x,yy,100,c.repos[0],c.color,c.id);repoPill(p.x,yy+34,100,c.repos[1],c.color,c.id)});[[280,32,'#a981ff'],[442,193,'#f5bd58'],[280,354,'#5bd2f1'],[118,193,'#64d287']].forEach(([x,y,c])=>{svg.append(S('circle',{cx:x,cy:y,r:6,fill:'#0a111b',stroke:c,'stroke-width':1.3}));svg.append(S('circle',{cx:x,cy:y,r:2,fill:c}))})}function renderTechno(){owner(280,193,39);const cfg={ai:{x:165,y:100,side:'l'},robot:{x:395,y:100,side:'r'},systems:{x:165,y:286,side:'l'},sim:{x:395,y:286,side:'r'}};DATA.forEach(c=>{const p=cfg[c.id],dim=focus&&DATA.some(x=>x.id===focus)&&focus!==c.id;svg.append(S('path',{d:`M280 193 L${p.x} ${p.y}`,stroke:c.color,'stroke-width':1,opacity:dim?.15:.55,fill:'none'}));const g=S('g',{class:dim?'dim':''});g.append(S('circle',{cx:p.x,cy:p.y,r:30,fill:'#0b1420',stroke:c.color,'stroke-width':1.4}));g.append(S('circle',{cx:p.x,cy:p.y,r:36,fill:'none',stroke:c.color,'stroke-width':.6,'stroke-dasharray':'2 3',opacity:.55}));g.append(S('text',{x:p.x,y:p.y+4,class:'catLabel',fill:c.color},c.name));svg.append(g);const x=p.side==='l'?63:497;const ys=[p.y-29,p.y+29];c.repos.forEach((r,i)=>{svg.append(S('path',{d:`M${p.x+(p.side==='l'?-31:31)} ${p.y} L${p.side==='l'?x+48:x-48} ${ys[i]}`,stroke:c.color,'stroke-width':.8,opacity:groupDim(c.id,r)?.12:.55,fill:'none'}));repoPill(x,ys[i],100,r,c.color,c.id)})})}function renderOrrery(){owner(280,193,34);const cfg={ai:{x:165,y:95,side:'l'},robot:{x:395,y:95,side:'r'},systems:{x:165,y:291,side:'l'},sim:{x:395,y:291,side:'r'}};[78,128,172].forEach(r=>svg.append(S('circle',{cx:280,cy:193,r,class:'orbital',stroke:'#52627a'})));DATA.forEach(c=>{const p=cfg[c.id],dim=focus&&DATA.some(x=>x.id===focus)&&focus!==c.id;svg.append(S('path',{d:`M280 193 L${p.x} ${p.y}`,stroke:c.color,'stroke-width':1,opacity:dim?.12:.65,fill:'none'}));const g=S('g',{class:dim?'dim':''});g.append(S('circle',{cx:p.x,cy:p.y,r:27,fill:'#0b1420',stroke:c.color,'stroke-width':1.5,class:'selectedGlow'}));g.append(S('circle',{cx:p.x,cy:p.y,r:41,class:'orbital',stroke:c.color}));g.append(S('text',{x:p.x,y:p.y+4,class:'catLabel',fill:c.color},c.name));svg.append(g);const px=p.side==='l'?80:480,ys=[p.y-21,p.y+24];c.repos.forEach((r,i)=>{svg.append(S('path',{d:`M${p.x+(p.side==='l'?-28:28)} ${p.y} Q${(p.x+px)/2} ${ys[i]} ${px+(p.side==='l'?11:-11)} ${ys[i]}`,stroke:c.color,'stroke-width':.9,opacity:groupDim(c.id,r)?.12:.62,fill:'none'}));const gg=S('g',{class:groupDim(c.id,r)?'dim':''});gg.append(S('circle',{cx:px,cy:ys[i],r:11,fill:'#111b29',stroke:c.color,'stroke-width':1,class:'planet'}));gg.append(S('circle',{cx:px-3,cy:ys[i]-3,r:3,fill:c.color,opacity:.25}));gg.append(S('text',{x:px+(p.side==='l'?-17:17),y:ys[i]+3,fill:'#edf3ff','font-size':7.5,'font-weight':650,'text-anchor':p.side==='l'?'end':'start'},r));gg.addEventListener('click',()=>setFocus(r));svg.append(gg)})})}function renderDetonation(){renderTechno();if(focus!=='Civitas')return;const x=63,y=129;[20,29,39].forEach(r=>svg.append(S('circle',{cx:x,cy:y,r,class:'burst'})));for(let a=0;a<360;a+=30){const rad=a*Math.PI/180;svg.append(S('line',{x1:x+Math.cos(rad)*16,y1:y+Math.sin(rad)*16,x2:x+Math.cos(rad)*48,y2:y+Math.sin(rad)*48,class:'burst-ray'}))}const rels=[{x:170,y:145,t:'Minecraft'},{x:170,y:179,t:'AI/RAG'}];rels.forEach((r,i)=>{svg.append(S('path',{d:`M78 ${y+i*2} Q116 ${y+i*18} ${r.x-52} ${r.y}`,class:'relation'}));const g=S('g');g.append(S('rect',{x:r.x-48,y:r.y-11,width:96,height:22,rx:8,fill:'#130f1d',stroke:'#cf84ff','stroke-width':1}));g.append(S('text',{x:r.x,y:r.y+3,class:'repoLabel'},r.t));svg.append(g)})}function render(){svg.replaceChildren();defs();({arcane:renderArcane,techno:renderTechno,orrery:renderOrrery,detonation:renderDetonation}[style]||renderArcane)();document.getElementById('styleTitle').textContent=STYLES.find(s=>s[0]===style)?.[1]||style;chip.textContent=focus?`Focus: ${focus}`:'No focus · click a category or repository';renderPanel();renderStylebar()}function renderPanel(){cats.innerHTML='';DATA.forEach(c=>{const box=document.createElement('div');box.className='category'+(openCats.has(c.id)?' open':'');const h=document.createElement('div');h.className='cat-head';const f=document.createElement('button');f.className='cat-focus';f.innerHTML=`<span class="dot" style="color:${c.color};background:${c.color}"></span><span>${c.name}</span>`;f.onclick=()=>{focus=c.id;render()};const t=document.createElement('button');t.className='cat-toggle';t.setAttribute('aria-label',`${openCats.has(c.id)?'Collapse':'Expand'} ${c.name}`);t.textContent=openCats.has(c.id)?'−':'+';t.onclick=()=>{openCats.has(c.id)?openCats.delete(c.id):openCats.add(c.id);render()};h.append(f,t);box.append(h);const list=document.createElement('div');list.className='repo-list';c.repos.forEach(r=>{const b=document.createElement('button');b.className='repo-btn'+(focus===r?' active':'');b.textContent=r;b.onclick=e=>{e.stopPropagation();setFocus(r)};list.append(b)});box.append(list);cats.append(box)})}function renderStylebar(){const bar=document.getElementById('stylebar');bar.innerHTML='';STYLES.forEach(([id,label])=>{const b=document.createElement('button');b.className=id===style?'active':'';b.textContent=label.replace(' v2','').replace('Detonation Focus','Focus');b.onclick=()=>{style=id;if(style==='detonation'&&!focus)focus='Civitas';render()};bar.append(b)})}function setFocus(v){focus=v;render()}document.getElementById('clearFocus').onclick=()=>{focus=null;render()};render();</script>
